<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e5e2a">
<title>Agropecuária 2D</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Agro 2D">
<meta name="format-detection" content="telephone=no">
<style>
:root{--v:#2e5e2a;--v2:#3f7f39;--vc:#e8f2e5;--terra:#9a6a2f;--bg:#f5f5f0;--card:#fff;--t:#1e261d;--m:#69756a;--b:#dfe3da;--r:#b23a2e;--rc:#fbe8e5;--a:#b7791f;--ac:#fdf3df;--az:#2c6aa8}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:14px}
header{background:var(--v);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}
header .sub{font-size:12px;opacity:.85}
#sync{margin-left:auto;font-size:12px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:14px;cursor:pointer;border:0;color:#fff}
nav{background:#fff;border-bottom:1px solid var(--b);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font-size:14px;color:var(--m);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--v);border-color:var(--v);font-weight:600}
main{padding:14px;max-width:1300px;margin:0 auto}
h2{margin:4px 0 12px;font-size:19px}
h3{margin:0 0 10px;font-size:15px;color:var(--v)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:12px}
.card .l{font-size:12px;color:var(--m)}.card .x{font-size:21px;font-weight:600;margin-top:3px}.card .s{font-size:11px;color:var(--m)}
.pos{color:var(--v2)}.neg{color:var(--r)}
.panel{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px;overflow-x:auto;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sp{flex:1}
.btn{background:var(--v);color:#fff;border:0;border-radius:7px;padding:9px 14px;font-size:14px;cursor:pointer}
.btn:hover{background:var(--v2)}.btn.sec{background:#fff;color:var(--v);border:1px solid var(--v)}.btn.red,.btn.red:hover{background:var(--r)}.btn.sm{padding:5px 9px;font-size:12px}
.btn.big{padding:14px 18px;font-size:16px;flex:1;min-width:150px}
input,select,textarea{font:inherit;padding:8px;border:1px solid #c8cfc3;border-radius:7px;background:#fff;color:var(--t);width:100%}
.toolbar input,.toolbar select{width:auto}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--b);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid #eef0eb;text-align:left;white-space:nowrap}
th{background:#f7f8f4;font-size:12px;color:var(--m);cursor:pointer;user-select:none}
.num{text-align:right}
tbody tr:hover{background:#f7faf5}
td.act{text-align:right}td.act button{border:0;background:none;font-size:16px;cursor:pointer;padding:2px 5px}
.empty{text-align:center;color:var(--m);padding:18px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:#eef0eb}
.tag.g{background:var(--vc);color:var(--v)}.tag.r{background:var(--rc);color:var(--r)}.tag.y{background:var(--ac);color:var(--a)}
.pager{padding:8px;font-size:12px;color:var(--m);display:flex;gap:8px;align-items:center}.pager button{border:1px solid var(--b);background:#fff;border-radius:4px;padding:2px 8px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 8px;z-index:50}
.modal.hide{display:none}
.mbox{background:#fff;border-radius:12px;width:100%;max-width:760px}
.mhead{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--b)}.mhead h3{margin:0;flex:1;font-size:16px}.mhead button{border:0;background:none;font-size:20px;cursor:pointer}
#mBody{padding:16px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}@media(max-width:650px){.form{grid-template-columns:1fr 1fr}.modal{padding:0}.mbox{border-radius:0;min-height:100%}}
.fld span{display:block;font-size:12px;color:var(--m);margin-bottom:3px}.fld.w{grid-column:1/-1}.hide2{display:none!important}
.sec-t{grid-column:1/-1;font-weight:600;color:var(--terra);border-bottom:1px solid var(--b);padding-bottom:3px;margin-top:6px}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.rt{grid-column:1/-1;border:1px solid var(--b);border-radius:8px;padding:8px}
.rtl{display:grid;grid-template-columns:24px 1fr 90px 110px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed #eceee8}
.rtl input[type=checkbox]{width:20px;height:20px}.rtl .pc{text-align:right}.rtl .rv{text-align:right;font-size:12px;color:var(--m)}
.rtt{display:flex;justify-content:space-between;padding-top:6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--b);border-radius:16px;padding:5px 12px;background:#fff;cursor:pointer;font-size:13px}.chip.on{background:var(--v);color:#fff;border-color:var(--v)}
.chart svg{width:100%;height:auto;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--m);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:12px}.banner.w{background:var(--ac);border:1px solid #efd39a}.banner.e{background:var(--rc);border:1px solid #efb7ae}
.help{font-size:13px;color:var(--m);line-height:1.55}
.res th:first-child,.res td:first-child{position:sticky;left:0;background:#fff;z-index:1}.res tr.dest td{font-weight:600;background:#f7faf5}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#223;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:99}#toast.on{opacity:1}
.ph{display:none}
:root{color-scheme:light}html{-webkit-text-size-adjust:100%}
nav .ic{margin-right:5px}nav .cu{display:none}
.so-cel{display:none}
details.filtro>summary{cursor:pointer;font-size:13px;color:var(--v);font-weight:600;padding:2px 0}details.filtro[open]>summary{margin-bottom:8px}
details.ac{border:1px solid var(--b);border-radius:9px;margin-bottom:8px;background:#fff}
details.ac>summary{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;cursor:pointer;list-style:none;min-height:46px}
details.ac>summary::-webkit-details-marker{display:none}details.ac>summary span:first-child::before{content:'▸ ';color:var(--m)}details.ac[open]>summary span:first-child::before{content:'▾ '}
details.ac>summary b{white-space:nowrap}
.ln{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-top:1px solid #eef0eb;font-size:14px}.ln>span:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.ln.dest{background:#f7faf5;font-weight:600}
.lc{padding:12px;border-bottom:1px solid #e6e9e2;cursor:pointer}.lc:active{background:#f2f6ef}
.lc-t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:15px}.lc-t>:first-child{min-width:0;overflow-wrap:anywhere}.lc-t>:last-child{white-space:nowrap;font-weight:600}
.lc-s{font-size:13px;color:var(--m);margin-top:3px;overflow-wrap:anywhere}.lc-a{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bc{margin-bottom:12px}.bc-t{font-weight:600;font-size:14px;margin-bottom:3px}.bc-l{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px;margin-bottom:3px}.bc-l i{display:block;height:14px;border-radius:3px;min-width:2px}.bc-l span{white-space:nowrap}
@media screen and (max-width:950px){
 .so-pc{display:none!important}.so-cel{display:block}
 body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}body.trava{overflow:hidden}
 header{flex-wrap:nowrap;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}header h1{font-size:16px;white-space:nowrap}header>div:nth-child(2){min-width:0}header .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #sync{white-space:nowrap;min-height:40px;padding:6px 12px;border-radius:20px;flex:none}
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--b);overflow:visible;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
 nav button{flex:1 1 0;min-width:0;min-height:58px;padding:5px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-bottom:0;border-top:3px solid transparent;font-size:11px}
 nav .ic{font-size:20px;margin:0}nav .lo{display:none}nav .cu{display:block}
 main{padding:10px 10px 4px}h2{font-size:18px}.panel{padding:12px}
 input,select,textarea{font-size:16px;min-height:44px}
 .btn{min-height:44px}.btn.sm{min-height:42px;font-size:13px;padding:8px 12px}.btn.big{min-width:0;padding:14px 10px;font-size:15px}
 .chip{min-height:40px;display:inline-flex;align-items:center;font-size:14px}
 .toolbar select,.toolbar input{flex:1 1 140px;min-width:0}.toolbar .busca{flex:1 1 100%}.toolbar .sp{display:none}
 .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.fld.wm{grid-column:1/-1;order:-1}.card{padding:10px;min-width:0}.card .x{font-size:clamp(14px,4.3vw,19px);overflow-wrap:anywhere}
 .help{overflow-wrap:anywhere}.panel td{white-space:normal}
 .pager button{min-width:44px;min-height:44px;font-size:18px}
 .modal{height:100vh;height:100dvh;padding:0;overscroll-behavior:contain}.mbox{border-radius:0;min-height:100%;display:flex;flex-direction:column}
 .mhead{position:sticky;top:0;background:#fff;z-index:3;padding:6px 6px 6px 14px;padding-top:max(6px,env(safe-area-inset-top))}.mhead button{min-width:46px;min-height:46px}
 #mBody{padding:12px 12px 0;flex:1;display:flex;flex-direction:column}#mBody form{flex:1;display:flex;flex-direction:column}
 .form{grid-template-columns:1fr 1fr;gap:10px}.form>span{display:none}.fld{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
 .fa{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--b);margin:14px -12px 0;margin-top:auto;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;flex-wrap:nowrap}.fa .btn{flex:1;padding:9px 6px}.fa .sp{display:none}
 .rt{margin-bottom:4px}.rtl{grid-template-columns:30px 1fr 92px;grid-template-areas:'c n p' 'c v p';gap:0 8px;padding:7px 0}.rtl input[type=checkbox]{grid-area:c;width:26px;height:26px;min-height:0}.rtl>span:nth-child(2){grid-area:n;font-size:15px;overflow-wrap:anywhere}.rtl .pc{grid-area:p}.rtl .rv{grid-area:v;text-align:left}
 .rt .toolbar .btn{flex:1 1 45%}
 #toast{bottom:calc(84px + env(safe-area-inset-bottom));width:max-content;max-width:90vw;text-align:center}
}
@media screen and (max-width:330px){.form{grid-template-columns:1fr}nav .cu{font-size:10px}}
@media print{header,nav,.np,.banner,#toast{display:none!important}body{background:#fff;font-size:11px}main{padding:0;max-width:none}.panel{break-inside:avoid;border:1px solid #ccc;padding:8px;overflow:visible}.ph{display:block;border-bottom:2px solid var(--v);margin-bottom:8px}th{background:#eee}}
</style>
</head>
<body>
<header><div style="font-size:24px">🌽</div><div><h1>Agropecuária 2D</h1><div class="sub" id="hSub">Gestão de custos e resultados</div></div><button id="sync" onclick="sincronizar(true)">…</button></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="modal" class="modal hide"><div class="mbox"><div class="mhead"><h3 id="mT"></h3><button onclick="fecharModal()">✕</button></div><div id="mBody"></div></div></div>
<div id="toast"></div>
<script>
"use strict";
/* ============ UTILITÁRIOS ============ */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>iso(new Date());
const addDias=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const fD=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const fN=(n,d=0)=>n==null||n===''||!isFinite(n)?'–':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fR=n=>n==null||n===''||!isFinite(n)?'–':Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
// valores por unidade: abaixo de R$ 1 mostra 4 casas (ex.: custo por espiga)
const fRu=n=>n==null||n===''||!isFinite(n)?'–':Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:Math.abs(n)<1?4:2});
const fP=n=>n==null||!isFinite(n)?'–':fN(n,1)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v==null)return null;v=String(v).trim().replace(/^R\$\s*/,'');if(v==='')return null;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isNaN(n)?null:n};
const nStr=v=>v===''||v==null?'':String(v).replace('.',',');
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const byNome=(a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
const mq=matchMedia('(max-width:950px)'),cel=()=>mq.matches;
const acord=(tit,val,cls,linhas,aberto)=>`<details class="ac"${aberto?' open':''}><summary><span>${tit}</span><b class="${cls||''}">${val}</b></summary><div>${linhas.map(([l,v,d])=>`<div class="ln${d?' dest':''}"><span>${l}</span><span>${v}</span></div>`).join('')}</div></details>`;
// no celular abre o menu de compartilhar (WhatsApp, Drive, e-mail); no computador baixa o arquivo
async function baixar(blob,nome){if(cel()&&navigator.canShare){try{const f=new File([blob],nome,{type:blob.type.split(';')[0]});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nome});return}}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function csv(nome,rows){const s='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n');baixar(new Blob([s],{type:'text/csv;charset=utf-8'}),nome+'_'+hoje()+'.csv')}
const csvNum=v=>v==null||v===''||!isFinite(v)?'':String(Math.round(v*100)/100).replace('.',',');

/* ============ DADOS PADRÃO (iguais aos do Code.gs) ============ */
const DATA_PADRAO='2000-01-01T00:00:00.000Z';
const CENTROS_PADRAO=[['c-milho','Milho','espigas'],['c-melancia','Melancia','kg'],['c-feijao','Feijão','kg'],['c-ovinos','Ovinos','kg vivo'],['c-silagem','Silagem','tonelada']];
const CATEGORIAS_PADRAO=[['k-corretivos','Corretivos (calcário, gesso)','COE'],['k-fertilizantes','Fertilizantes e adubos','COE'],['k-sementes','Sementes e mudas','COE'],['k-defensivos','Defensivos agrícolas','COE'],['k-mecanizacao','Operações mecanizadas / hora-máquina','COE'],['k-combustivel','Combustível e lubrificantes','COE'],['k-maodeobra','Mão de obra contratada','COE'],['k-irrigacao','Irrigação e energia','COE'],['k-embalagens','Embalagens e lonas','COE'],['k-inoculantes','Inoculantes e aditivos','COE'],['k-racao','Ração, sal e suplementos','COE'],['k-sanidade','Sanidade animal','COE'],['k-animais','Aquisição de animais','COE'],['k-frete','Frete e comercialização','COE'],['k-manutencao','Manutenção de máquinas e benfeitorias','COE'],['k-arrendamento','Arrendamento','COE'],['k-assistencia','Assistência técnica','COE'],['k-impostos','Impostos e taxas (Funrural etc.)','COE'],['k-juros','Juros de custeio','COE'],['k-outras','Outras despesas','COE'],['k-depreciacao','Depreciação de máquinas e benfeitorias','COT'],['k-prolabore','Mão de obra familiar / pró-labore','COT']];
const UNIDADES=['espigas','saca 60 kg','kg','tonelada','unidade','kg vivo','cabeça','caixa','dúzia','litro','fardo'];
const NUMS=['quantidade','precoUnit','valor','area','servidorEm'];

/* ============ ESTADO LOCAL ============ */
const TABS=['Lancamentos','Centros','Categorias','Usuarios'];
function novoEstado(){return{T:{Lancamentos:{},Centros:{},Categorias:{},Usuarios:{}},pend:{},env:{},cursor:0,cursorEm:0,cfg:{url:'',chave:'',usuarioId:'',ultimaSync:null,configurado:false,em:0}}}
let S=novoEstado(),REV=0;
const vivos=t=>Object.values(S.T[t]).filter(r=>r.excluido!=='1');
const ativos=t=>vivos(t).filter(r=>r.ativo!=='0').sort(byNome);
const eu=()=>S.T.Usuarios[S.cfg.usuarioId];
// Conta 2D: conta conjunta do projeto. Código fixo, igual em todos os aparelhos.
const CONTA='conta-2d',CONTA_NOME='Conta 2D';
const nomeU=(id,alt)=>id===CONTA?CONTA_NOME:(S.T.Usuarios[id]?.nome||alt||'');
const icU=id=>id===CONTA?'🏦':'👤';
// Aporte: usuário -> Conta 2D. Retirada: Conta 2D -> usuário. Não são receita nem despesa.
const TRANSF={Aporte:'Aporte à Conta 2D',Retirada:'Retirada da Conta 2D'};
const ehTransf=l=>!!TRANSF[l.tipo];
const editarLanc=l=>ehTransf(l)?formTransf(l.tipo,l):formLanc(l.tipo,l);
const corTipo=l=>l.tipo==='Receita'?'g':ehTransf(l)?'y':'r';
function semearLocal(){CENTROS_PADRAO.forEach(([id,nome,unidade])=>{const x=S.T.Centros[id];if(!x||(x.atualizadoEm===DATA_PADRAO&&!x.servidorEm))S.T.Centros[id]={id,nome,unidade,area:'',ciclo:'',ativo:'1',autor:'sistema',atualizadoEm:DATA_PADRAO,excluido:''}});
 CATEGORIAS_PADRAO.forEach(([id,nome,grupo])=>{if(!S.T.Categorias[id])S.T.Categorias[id]={id,nome,grupo,ativo:'1',autor:'sistema',atualizadoEm:DATA_PADRAO,excluido:''}})}
// carimbo sempre maior que o anterior: evita que relógio atrasado faça o servidor recusar a edição
function carimbo(...ant){let t=Date.now();ant.forEach(a=>{const x=Date.parse(a||'');if(x>=t)t=x+1});return new Date(t).toISOString()}
function cfgSet(o){Object.assign(S.cfg,o,{em:Date.now()});salvar()}
function zerarCursor(){S.cursor=0;S.cursorEm=Date.now()}
function gravar(tab,rec){const ant=S.T[tab][rec.id];rec.atualizadoEm=carimbo(rec.atualizadoEm,ant&&ant.atualizadoEm);rec.autor=eu()?eu().nome:'';if(rec.excluido!=='1')rec.excluido='';S.T[tab][rec.id]=rec;S.pend[rec.id]=tab;REV++;marcar();salvarJa();agendarSync()}
function excluir(tab,id){gravar(tab,Object.assign({},S.T[tab][id],{excluido:'1'}))}
function limpar(r){NUMS.forEach(k=>{if(k in r)r[k]=r[k]===''||r[k]==null?'':Number(r[k])});['excluido','ativo'].forEach(k=>{if(k in r)r[k]=String(r[k]===true?'1':r[k]===false?'':r[k])});return r}
function rateio(l){try{const r=JSON.parse(l.rateio||'[]');return Array.isArray(r)?r.filter(x=>x&&x.c&&+x.p>0).map(x=>({c:x.c,p:+x.p})):[]}catch(e){return[]}}

/* ============ PERSISTÊNCIA (IndexedDB + localStorage) ============ */
let _db=null;
function idb(){if(_db)return Promise.resolve(_db);return new Promise((res,rej)=>{const r=indexedDB.open('Agro2D',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}
async function kv(mode,k,v){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('kv',mode),o=tx.objectStore('kv'),q=mode==='readonly'?o.get(k):o.put(v,k);tx.oncomplete=()=>res(q.result);tx.onerror=()=>rej(tx.error)})}
// Junta outra cópia dos dados em D, registro a registro: vale a versão mais recente e nada pendente é descartado.
// Uma pendência só some quando a planilha confirmou (env) aquela versão ou uma mais nova.
function juntar(D,O){if(!O||!O.T)return false;let mudou=false;const env=O.env||{};
 for(const id in env)if(!D.env[id]||env[id]>D.env[id])D.env[id]=env[id];
 TABS.forEach(t=>{const a=D.T[t],b=O.T[t]||{};for(const id in b){if(!b[id])continue;if(!a[id]||String(b[id].atualizadoEm||'')>String(a[id].atualizadoEm||'')){a[id]=b[id];mudou=true}}});
 for(const id in O.pend||{})if(!D.pend[id])D.pend[id]=O.pend[id];
 for(const id in D.pend){const r=(D.T[D.pend[id]]||{})[id];if(!r||(D.env[id]&&D.env[id]>=r.atualizadoEm))delete D.pend[id]}
 const ca=D.cursorEm||0,cb=O.cursorEm||0;if(cb>ca){D.cursor=O.cursor||0;D.cursorEm=cb}else if(cb===ca)D.cursor=Math.max(D.cursor||0,O.cursor||0);
 const us=[D.cfg.ultimaSync,O.cfg&&O.cfg.ultimaSync].filter(Boolean).sort().pop()||null;
 if(O.cfg&&((O.cfg.em||0)>(D.cfg.em||0)||(!D.cfg.em&&!D.cfg.configurado)))Object.assign(D.cfg,O.cfg);D.cfg.ultimaSync=us;return mudou}
let tSalvar=null,erroLocal=false,vMem=0,vDisco=0;
const marcar=()=>{vMem++};
function salvar(){marcar();clearTimeout(tSalvar);tSalvar=setTimeout(salvarJa,200)}
// Lê, junta e grava na mesma transação: outra janela aberta nunca é sobrescrita.
async function salvarJa(){clearTimeout(tSalvar);tSalvar=null;const v=vMem;let ok=false,mudou=false,okIdb=false;
 try{const d=await idb();await new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite'),o=tx.objectStore('kv'),q=o.get('estado');
   q.onsuccess=()=>{try{let ant=null;if(q.result){try{ant=JSON.parse(q.result)}catch(e){o.put(q.result,'estado_danificado_'+Date.now())}}mudou=juntar(S,ant);o.put(JSON.stringify(S),'estado')}catch(e){tx.abort();rej(e)}};
   tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});ok=okIdb=true}catch(e){}
 if(gravarLS())ok=true;else if(okIdb)try{localStorage.removeItem('agro2d')}catch(e){}
 if(ok)vDisco=Math.max(vDisco,v);
 if(!ok&&!erroLocal)setTimeout(()=>alert('ATENÇÃO: o aparelho não conseguiu guardar os dados. Não feche o app antes de sincronizar.'),0);
 erroLocal=!ok;if(mudou){REV++;if($('#modal').classList.contains('hide'))render();else precisaRender=true}statusSync()}
function gravarLS(){try{const b=localStorage.getItem('agro2d');if(b){try{juntar(S,JSON.parse(b))}catch(e){}}localStorage.setItem('agro2d',JSON.stringify(S));return true}catch(e){return false}}

 S=novoEstado();juntar(S,A);juntar(S,B);if(A||B)salvar();
 semearLocal();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}REV++}

let sincronizando=false,tSync=null,erroSync='';
function agendarSync(ms=1500){if(!S.cfg.url)return;clearTimeout(tSync);tSync=setTimeout(()=>sincronizar(),ms)}
async function chamar(corpo,url,chave){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
 try{const r=await fetch(url||S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({chave:chave??S.cfg.chave},corpo)),signal:ctl.signal,redirect:'follow'});
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error('Resposta inesperada do servidor (confira o endereço e se a implantação está como "Qualquer pessoa").')}if(!j.ok)throw new Error(j.erro||'Erro no servidor');return j}
 catch(e){if(e.name==='AbortError')throw new Error('Tempo esgotado (internet lenta?)');if(e instanceof TypeError)throw new Error('Sem conexão com a planilha');throw e}finally{clearTimeout(to)}}
async function sincronizar(manual){if(!S.cfg.url){if(manual)ir('config');return}if(sincronizando)return;
 if(!navigator.onLine){erroSync='Sem internet — lançamentos guardados no aparelho';statusSync();if(manual)toast(erroSync);return}
 sincronizando=true;statusSync();let mudou=false;
 try{for(let volta=0;volta<30;volta++){const ids=Object.keys(S.pend).slice(0,150);const mud=ids.map(id=>({tabela:S.pend[id],registro:S.T[S.pend[id]][id]})).filter(m=>m.registro);const env=mud.map(m=>[m.registro.id,m.registro.atualizadoEm]);
   const j=await chamar({acao:'sync',cursor:S.cursor,mudancas:mud});
   env.forEach(([id,at])=>{const t=S.pend[id];if(t&&S.T[t][id]&&S.T[t][id].atualizadoEm===at)delete S.pend[id];if(!S.env[id]||at>S.env[id])S.env[id]=at});
   ids.forEach(id=>{const t=S.pend[id];if(t&&!S.T[t][id])delete S.pend[id]});
   for(const r of j.registros||[]){const t=r.tabela;delete r.tabela;if(!S.T[t])continue;const loc=S.T[t][r.id];if(loc&&S.pend[r.id]&&String(loc.atualizadoEm)>String(r.atualizadoEm))continue;if(S.env[r.id]||S.pend[r.id]){S.env[r.id]=r.atualizadoEm;delete S.pend[r.id]}S.T[t][r.id]=limpar(r);mudou=true}
   S.cursor=j.cursor||S.cursor;if(!Object.keys(S.pend).length)break}
  S.cfg.ultimaSync=new Date().toISOString();erroSync='';if(manual)toast('Sincronizado com a planilha ✔')}
 catch(e){erroSync=e.message;if(manual)toast('⚠ '+e.message)}
 finally{sincronizando=false;salvar();if(mudou){REV++;if($('#modal').classList.contains('hide'))render();else precisaRender=true}statusSync()}}
let precisaRender=false;
setInterval(()=>{if(!document.hidden)sincronizar()},90000);
window.addEventListener('online',()=>agendarSync(500));window.addEventListener('offline',statusSync);
function statusSync(){const b=$('#sync');if(!b)return;const np=Object.keys(S.pend).length;let t;
 if(erroLocal)t='⚠ erro ao salvar no aparelho';else if(!S.cfg.url)t='📴 Só neste aparelho';else if(sincronizando)t='🔄 Sincronizando…';else if(erroSync)t='⚠ '+(np?np+' pendente(s) • ':'')+(navigator.onLine?'falha na sincronização':'sem internet');
 else if(np)t='⏳ '+np+' alteração(ões) a enviar';else t='✔ Sincronizado'+(S.cfg.ultimaSync?' '+new Date(S.cfg.ultimaSync).toLocaleTimeString('pt-BR').slice(0,5):'');
 if(cel())t=erroLocal?'⚠ erro':!S.cfg.url?'📴 Local':sincronizando?'🔄 …':erroSync?'⚠ '+(np?np+' a enviar':(navigator.onLine?'falha':'sem net')):np?'⏳ '+np+' a enviar':'✔ '+(S.cfg.ultimaSync?new Date(S.cfg.ultimaSync).toLocaleTimeString('pt-BR').slice(0,5):'ok');
 b.textContent=t;b.title=erroSync||'Clique para sincronizar agora'}

 const w=el.querySelector('.tw');let cur=[];const fmt=(v,c)=>v==null||v===''?'':c.t==='d'?fD(v):c.t==='$'?fR(v):c.t==='n'?fN(v,c.dc??2):String(v);
 const draw=()=>{let r=rows;if(st.q){const q=st.q.toLowerCase();r=r.filter(x=>cols.some(c=>fmt(c.v(x),c).toLowerCase().includes(q)))}

  cur=r;const ps=100,np=Math.max(1,Math.ceil(r.length/ps));if(st.pg>=np)st.pg=np-1;const pr=r.slice(st.pg*ps,st.pg*ps+ps);

 draw();el.querySelector('.busca').oninput=e=>{st.q=e.target.value;st.pg=0;draw()};

 w.onclick=e=>{const th=e.target.closest('th[data-i]');if(th){const i=+th.dataset.i;if(st.s===i)st.d*=-1;else{st.s=i;st.d=1}draw();return}

function barras(labels,series,o={}){const W=820,H=o.h||260,pl=78,pb=36,pt=12,pr=10,iw=W-pl-pr,ih=H-pt-pb;const all=series.flatMap(s=>s.values.map(v=>v||0));
 let mx=Math.max(0,...all),mn=Math.min(0,...all);if(mx===mn)mx=1;const pd=(mx-mn)*.08;mx+=pd;if(mn<0)mn-=pd;
 const Y=v=>pt+ih-ih*(v-mn)/(mx-mn),n=Math.max(1,labels.length),gw=iw/n,bw=Math.max(3,Math.min(34,gw*.8/series.length));const fy=v=>Math.abs(v)>=1e6?fN(v/1e6,1)+' mi':Math.abs(v)>=1e3?fN(v/1e3,0)+' mil':fN(v);let g='';
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e6e9e2"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#69756a">${fy(v)}</text>`}
 if(mn<0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="#999"/>`;
 labels.forEach((l,i)=>{const x0=pl+gw*i+(gw-bw*series.length)/2;series.forEach((s,j)=>{const v=s.values[i]||0,y1=Y(Math.max(0,v)),y2=Y(Math.min(0,v));g+=`<rect x="${x0+j*bw}" y="${y1}" width="${bw-1}" height="${Math.max(0,y2-y1)}" fill="${s.cor}" rx="2"><title>${esc(s.nome)} — ${esc(l)}: ${fR(v)}</title></rect>`});
  g+=`<text x="${pl+gw*i+gw/2}" y="${H-pb+16}" text-anchor="middle" font-size="11" fill="#69756a">${esc(String(l).slice(0,16))}</text>`});
 const leg=series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>`:'';
 const mxA=Math.max(1,...all.map(Math.abs));
 const hc=labels.map((l,i)=>`<div class="bc"><div class="bc-t">${esc(l)}</div>${series.map(s=>{const v=s.values[i]||0;return`<div class="bc-l"><i style="width:${Math.abs(v)/mxA*100}%;background:${s.cor};${v<0?'opacity:.45':''}"></i><span class="${v<0?'neg':''}">${fR(v)}</span></div>`}).join('')}</div>`).join('');
 return`<div class="chart so-pc"><svg viewBox="0 0 ${W} ${H}">${g}</svg>${leg}</div><div class="so-cel" style="margin-top:12px">${hc}${leg}</div>`}

/* ============ CÁLCULOS ============ */
// centros que aparecem em filtros e relatórios: ativos, ou inativos que tenham algum lançamento
function centrosVis(){const us=new Set();vivos('Lancamentos').forEach(l=>rateio(l).forEach(x=>us.add(x.c)));return vivos('Centros').filter(c=>c.ativo!=='0'||us.has(c.id)).sort(byNome)}
function filtrarLanc(F){return vivos('Lancamentos').filter(l=>(!F.ini||l.data>=F.ini)&&(!F.fim||l.data<=F.fim))}
function calcular(F){const L=filtrarLanc(F),sel=F.centros&&F.centros.length?new Set(F.centros):null;
 const C={};vivos('Centros').sort(byNome).forEach(c=>{if(!sel||sel.has(c.id))C[c.id]={c,rb:0,q:0,coe:0,nd:0,cat:{},rbPend:0,coePend:0}});
 const U={},semRateio=[];const uRow=id=>U[id]=U[id]||{des:0,pend:0,rec:0,recPend:0,ap:0,ret:0,centro:{},cat:{}};
 for(const l of L){if(ehTransf(l)){if(!sel&&l.status==='Pago'){const u=uRow(l.usuarioId||'?');u[l.tipo==='Aporte'?'ap':'ret']+=+l.valor||0}continue}const rt=rateio(l);if(!rt.length){semRateio.push(l);continue}const k=S.T.Categorias[l.categoriaId],cot=k&&k.grupo==='COT';
  for(const{c,p}of rt){const x=C[c];if(!x)continue;const v=(+l.valor||0)*p/100;
   if(l.tipo==='Receita'){x.rb+=v;x.q+=(+l.quantidade||0)*p/100;if(l.status==='Pendente')x.rbPend+=v;const u=uRow(l.usuarioId||'?');if(l.status==='Pago')u.rec+=v;else u.recPend+=v}
   else{if(cot)x.nd+=v;else x.coe+=v;x.cat[l.categoriaId]=(x.cat[l.categoriaId]||0)+v;if(l.status==='Pendente')x.coePend+=v;
    if(!cot){const u=uRow(l.usuarioId||'?');if(l.status==='Pago'){u.des+=v;u.centro[c]=(u.centro[c]||0)+v;u.cat[l.categoriaId]=(u.cat[l.categoriaId]||0)+v}else u.pend+=v}}}}
 Object.values(C).forEach(x=>{x.cot=x.coe+x.nd;x.mb=x.rb-x.coe;x.lucro=x.rb-x.cot;x.pm=x.q?x.rb/x.q:null;x.coeU=x.q?x.coe/x.q:null;x.cotU=x.q?x.cot/x.q:null;x.mbU=x.q?x.mb/x.q:null;x.lucroU=x.q?x.lucro/x.q:null;
  x.mbP=x.rb?x.mb/x.rb*100:null;x.pe=x.pm?x.coe/x.pm:null;x.area=+x.c.area||0;x.coeHa=x.area?x.coe/x.area:null;x.mbHa=x.area?x.mb/x.area:null;x.prodHa=x.area&&x.q?x.q/x.area:null});
 for(const id in C)if(C[id].c.ativo==='0'&&!C[id].rb&&!C[id].q&&!C[id].cot)delete C[id]; // inativo sem movimento no período
 const T={rb:0,coe:0,nd:0,cot:0,mb:0,lucro:0};Object.values(C).forEach(x=>{for(const k in T)T[k]+=x[k]});T.mbP=T.rb?T.mb/T.rb*100:null;
 for(const id in U){const u=U[id];u.col=u.des+u.ap;u.tirou=u.rec+u.ret}
 const totDes=sum(Object.keys(U).filter(id=>id!==CONTA).map(id=>U[id].col)); // bolso dos usuários: despesas pagas + aportes
 return{L,C,T,U,totDes,semRateio}}

/* ============ FLUXO DE CAIXA REALIZADO (só pagos/recebidos) ============ */
function caixa(F){const sel=F&&F.centros&&F.centros.length?new Set(F.centros):null,M={},meses=new Set(),nv=()=>({e:0,s:0,ti:0,to:0});
 const add=(id,m,k,v)=>{const a=M[id]=M[id]||Object.assign(nv(),{mes:{}});a[k]+=v;const b=a.mes[m]=a.mes[m]||nv();b[k]+=v;meses.add(m)};
 (F?filtrarLanc(F):vivos('Lancamentos')).forEach(l=>{if(l.status!=='Pago')return;const id=l.usuarioId||'?',m=l.data.slice(0,7);
  if(ehTransf(l)){if(sel)return;const v=+l.valor||0,ap=l.tipo==='Aporte';add(ap?id:CONTA,m,'to',v);add(ap?CONTA:id,m,'ti',v);return}
  if(l.tipo!=='Receita'&&S.T.Categorias[l.categoriaId]?.grupo==='COT')return;
  const fr=sel?sum(rateio(l).filter(x=>sel.has(x.c)).map(x=>x.p))/100:1;if(fr)add(id,m,l.tipo==='Receita'?'e':'s',(+l.valor||0)*fr)});
 const e=sum(Object.values(M).map(a=>a.e)),s=sum(Object.values(M).map(a=>a.s));return{M,meses:[...meses].sort(),e,s,sel:!!sel}}
const saldoCx=a=>a.e-a.s+a.ti-a.to;
function caixaH(K){const z={e:0,s:0,ti:0,to:0},ids=[CONTA,...Object.keys(K.M).filter(x=>x!==CONTA).sort((a,b)=>nomeU(a).localeCompare(nomeU(b),'pt-BR'))],A=id=>K.M[id]||Object.assign({mes:{}},z),nm=id=>icU(id)+' '+esc(nomeU(id,'(sem usuário)')),cl=v=>v>=0?'pos':'neg',ml=m=>m.slice(5)+'/'+m.slice(0,4);
 const dm=(a,m)=>a.mes[m]||z;let ac=0;const lin=id=>{const a=A(id),c=id===CONTA;return[['Receitas recebidas',fR(a.e)],[c?'Aportes dos usuários':'Retiradas recebidas da Conta 2D',fR(a.ti)],['Despesas pagas','− '+fR(a.s)],[c?'Retiradas para os usuários':'Aportes feitos à Conta 2D','− '+fR(a.to)],[c?'Saldo no período':'Saldo do bolso',fR(saldoCx(a)),1]]};
 return`<div class="panel"><h3>Fluxo de caixa realizado — Conta 2D e bolso dos usuários</h3>
 <div class="so-cel">${ids.map(id=>{const a=A(id),v=saldoCx(a);return acord(nm(id),fR(v),cl(v),[...lin(id),...K.meses.filter(m=>a.mes[m]).map(m=>{const d=dm(a,m);return[ml(m),`<span class="pos">+${fR(d.e+d.ti)}</span><br><span class="neg">−${fR(d.s+d.to)}</span>`]})],id===CONTA)}).join('')}
 ${acord('Total do projeto',fR(K.e-K.s),cl(K.e-K.s),[['Receitas recebidas',fR(K.e)],['Despesas pagas','− '+fR(K.s)],['Resultado de caixa',fR(K.e-K.s),1]],true)}</div>
 <div class="tw so-pc"><table><thead><tr><th>Conta / usuário</th><th class="num">Receitas recebidas</th><th class="num">Transf. recebidas</th><th class="num">Despesas pagas</th><th class="num">Transf. enviadas</th><th class="num">Saldo no período</th></tr></thead><tbody>${ids.map(id=>{const a=A(id),v=saldoCx(a);return`<tr><td><b>${nm(id)}</b></td><td class="num">${fR(a.e)}</td><td class="num">${fR(a.ti)}</td><td class="num">${fR(a.s)}</td><td class="num">${fR(a.to)}</td><td class="num ${cl(v)}"><b>${fR(v)}</b></td></tr>`}).join('')}<tr><td><b>Total do projeto</b></td><td class="num"><b>${fR(K.e)}</b></td><td class="num">–</td><td class="num"><b>${fR(K.s)}</b></td><td class="num">–</td><td class="num ${cl(K.e-K.s)}"><b>${fR(K.e-K.s)}</b></td></tr></tbody></table></div>
 ${K.meses.length?`<div class="tw so-pc" style="margin-top:10px"><table class="res"><thead><tr><th>Mês</th>${ids.map(id=>`<th class="num">${nm(id)}</th>`).join('')}<th class="num">Receitas</th><th class="num">Despesas</th><th class="num">Resultado do mês</th><th class="num">Acumulado</th></tr></thead><tbody>${K.meses.map(m=>{const e=sum(ids.map(i=>dm(A(i),m).e)),s=sum(ids.map(i=>dm(A(i),m).s));ac+=e-s;return`<tr><td>${ml(m)}</td>${ids.map(i=>{const a=A(i),v=saldoCx(dm(a,m));return`<td class="num ${cl(v)}">${a.mes[m]?fR(v):'–'}</td>`}).join('')}<td class="num">${fR(e)}</td><td class="num">${fR(s)}</td><td class="num ${cl(e-s)}">${fR(e-s)}</td><td class="num ${cl(ac)}">${fR(ac)}</td></tr>`}).join('')}</tbody></table></div>`:''}
 ${K.sel?'<div class="banner w" style="margin:10px 0 0">Com filtro de centros, os aportes e retiradas ficam de fora, porque não pertencem a uma cultura. Para ver o saldo da Conta 2D, marque todos os centros.</div>':''}
 <p class="help">Só o que já foi <b>pago ou recebido</b>, pela data do lançamento. Aportes e retiradas mudam o saldo da Conta 2D e dos usuários, mas não o total do projeto. Valor negativo em um usuário = ele colocou mais dinheiro do que recebeu. Se a conta já tinha dinheiro antes, lance-o como aporte de quem o depositou.</p></div>`}

/* ============ LANÇAMENTOS ============ */
function lanc(el){const st=VS.lf=VS.lf||{mes:'',tipo:'',centro:'',cat:'',user:'',status:''};
 const rows=vivos('Lancamentos').filter(l=>(!st.mes||l.data.startsWith(st.mes))&&(!st.tipo||l.tipo===st.tipo)&&(!st.centro||rateio(l).some(x=>x.c===st.centro))&&(!st.cat||l.categoriaId===st.cat)&&(!st.user||l.usuarioId===st.user||(st.user===CONTA&&ehTransf(l)))&&(!st.status||l.status===st.status));
 const meses=[...new Set(vivos('Lancamentos').map(l=>l.data.slice(0,7)))].sort().reverse(),sel=(id,v,os)=>`<select id="${id}">${os.map(o=>opt(o[0],o[1],v)).join('')}</select>`;
 const rec=sum(rows.filter(l=>l.tipo==='Receita').map(l=>l.valor)),des=sum(rows.filter(l=>l.tipo==='Despesa').map(l=>l.valor));
 el.innerHTML=`<h2>Lançamentos</h2><details class="panel np filtro" id="lDet"${(VS.lfAb==null?!cel():VS.lfAb)?' open':''}><summary>Filtros: ${Object.values(st).filter(Boolean).length||'nenhum'} ${Object.values(st).filter(Boolean).length?'ativo(s)':'ativo'}</summary><div class="toolbar" style="margin:0">${sel('lM',st.mes,[['','Todos os meses'],...meses.map(m=>[m,m.slice(5)+'/'+m.slice(0,4)])])}${sel('lT',st.tipo,[['','Todos os tipos'],['Receita','Receitas'],['Despesa','Despesas'],['Aporte','Aportes'],['Retirada','Retiradas']])}

 ${sel('lU',st.user,[['','Todos os usuários e conta'],[CONTA,CONTA_NOME],...vivos('Usuarios').sort(byNome).map(u=>[u.id,u.nome])])}${sel('lS',st.status,[['','Pagos e pendentes'],['Pago','Pagos/recebidos'],['Pendente','Pendentes']])}</div></details>
 <div class="cards"><div class="card"><div class="l">Receitas (filtro)</div><div class="x pos">${fR(rec)}</div></div><div class="card"><div class="l">Despesas (filtro)</div><div class="x neg">${fR(des)}</div></div><div class="card"><div class="l">Receitas − despesas</div><div class="x ${rec-des>=0?'pos':'neg'}">${fR(rec-des)}</div></div></div><div id="lst"></div>`;
 $('#lDet').querySelector('summary').onclick=()=>{VS.lfAb=!$('#lDet').open};
 [['lM','mes'],['lT','tipo'],['lC','centro'],['lK','cat'],['lU','user'],['lS','status']].forEach(([i,k])=>$('#'+i).onchange=e=>{st[k]=e.target.value;lanc(el)});

 lista($('#lst'),'lanc',rows,[{h:'Data',v:l=>l.data,t:'d'},{h:'Tipo',v:l=>l.tipo,f:l=>`<span class="tag ${corTipo(l)}">${esc(l.tipo)}</span>`},{h:'Categoria',v:l=>l.tipo==='Receita'?'Venda':(S.T.Categorias[l.categoriaId]?.nome||l.categoria)},{h:'Descrição',v:l=>l.descricao},
  {h:'Centros (rateio)',v:l=>rateio(l).map(x=>(S.T.Centros[x.c]?.nome||'?')+(x.p<100?' '+fN(x.p,0)+'%':'')).join(', ')},{h:'Qtd.',v:l=>l.quantidade,t:'n',f:l=>l.quantidade?fN(l.quantidade,2)+' '+esc(l.unidade||''):''},
  {h:'Valor',v:l=>+l.valor,t:'$',f:l=>`<span class="${ehTransf(l)?'':l.tipo==='Receita'?'pos':'neg'}">${fR(l.valor)}</span>`},{h:'Usuário / conta',v:l=>nomeU(l.usuarioId,l.usuario)},
  {h:'Situação',v:l=>l.status,f:l=>l.status==='Pendente'?`<span class="tag y">${l.tipo==='Receita'?'A receber':'A pagar'}${l.vencimento?' '+fD(l.vencimento):''}</span>`:`<span class="tag">${ehTransf(l)?'Realizado':l.tipo==='Receita'?'Recebido':'Pago'}</span>`},
  {h:'Sinc.',v:l=>S.pend[l.id]?'pendente':'ok',f:l=>S.pend[l.id]?'⏳':'✔'}],

   acoes:l=>(l.status==='Pendente'?'<button data-a="pg" title="Marcar como pago/recebido">✅</button>':'')+'<button data-a="ed" title="Editar">✏️</button>',

 el.innerHTML=`${filtroH()}<div class="toolbar np"><h2 style="margin:0">Relatórios</h2><span class="sp"></span><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button><button class="btn sec" id="rCsv">⬇ CSV (Excel)</button></div>

 ${caixaH(K)}
 <div class="panel"><h3>Quanto cada usuário colocou no projeto</h3><div class="so-cel">${us.map(u=>{const x=R.U[u.id];return acord(esc(u.nome),fR(x.col),'',[['Despesas pagas do bolso',fR(x.des)],['Aportes à Conta 2D',fR(x.ap)],['Total colocado',fR(x.col),1],['% do total',fP(R.totDes?x.col/R.totDes*100:null)],['Receitas recebidas',fR(x.rec)],['Retiradas da Conta 2D',fR(x.ret)],['Saldo (colocado − recebido)',fR(x.col-x.tirou),1],['A pagar (pendente)',fR(x.pend)]],true)}).join('')}${us.length?`<div class="ln dest"><span>Total colocado pelos usuários</span><span>${fR(tot.col)}</span></div>`:'<div class="empty">Sem lançamentos no período.</div>'}</div><div class="tw so-pc"><table><thead><tr><th>Usuário</th><th class="num">Despesas do bolso</th><th class="num">Aportes à Conta 2D</th><th class="num">Total colocado</th><th class="num">% do total</th><th class="num">Receitas recebidas</th><th class="num">Retiradas</th><th class="num">Saldo (colocado − recebido)</th><th class="num">A pagar</th></tr></thead><tbody>
 ${us.map(u=>{const x=R.U[u.id];return`<tr><td><b>${esc(u.nome)}</b></td><td class="num">${fR(x.des)}</td><td class="num">${fR(x.ap)}</td><td class="num"><b>${fR(x.col)}</b></td><td class="num">${fP(R.totDes?x.col/R.totDes*100:null)}</td><td class="num">${fR(x.rec)}</td><td class="num">${fR(x.ret)}</td><td class="num ${x.col-x.tirou>=0?'':'neg'}">${fR(x.col-x.tirou)}</td><td class="num">${fR(x.pend)}</td></tr>`}).join('')||'<tr><td colspan=9 class="empty">Sem lançamentos no período.</td></tr>'}
 <tr class="dest"><td><b>Total</b></td><td class="num">${fR(tot.des)}</td><td class="num">${fR(tot.ap)}</td><td class="num"><b>${fR(tot.col)}</b></td><td class="num">${us.length?'100%':''}</td><td class="num">${fR(tot.rec)}</td><td class="num">${fR(tot.ret)}</td><td class="num">${fR(tot.col-tot.tirou)}</td><td class="num">${fR(tot.pend)}</td></tr></tbody></table></div>
 ${us.length?barras(us.map(u=>u.nome),[{nome:'Colocado no projeto',cor:'#c0533f',values:us.map(u=>R.U[u.id].col)},{nome:'Recebido do projeto',cor:'#3f7f39',values:us.map(u=>R.U[u.id].tirou)}]):''}
 <p class="help"><b>Colocado</b> = despesas de custeio (COE) pagas do bolso + aportes à Conta 2D. <b>Recebido</b> = receitas recebidas + retiradas da Conta 2D. O que a Conta 2D pagou não entra de novo aqui. Saldo positivo = o usuário colocou mais do que recebeu.</p></div> <div class="panel"><h3>Pagamentos por usuário / Conta 2D e cultura</h3><div class="so-cel">${usC.filter(u=>R.U[u.id].des).map(u=>acord(esc(u.nome),fR(R.U[u.id].des),'',cs.filter(x=>R.U[u.id].centro[x.c.id]).map(x=>[esc(x.c.nome),fR(R.U[u.id].centro[x.c.id])]))).join('')}</div><div class="tw so-pc"><table class="res"><thead><tr><th>Usuário</th>${cs.map(x=>`<th class="num">${esc(x.c.nome)}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${usC.map(u=>`<tr><td>${esc(u.nome)}</td>${cs.map(x=>`<td class="num">${R.U[u.id].centro[x.c.id]?fR(R.U[u.id].centro[x.c.id]):'–'}</td>`).join('')}<td class="num"><b>${fR(R.U[u.id].des)}</b></td></tr>`).join('')}</tbody></table></div></div>
 <div class="panel"><h3>Pagamentos por usuário / Conta 2D e categoria</h3><div class="so-cel">${cats.map(k=>acord(esc(k.nome),fR(sum(usC.map(u=>R.U[u.id].cat[k.id]||0))),'',usC.filter(u=>R.U[u.id].cat[k.id]).map(u=>[esc(u.nome),fR(R.U[u.id].cat[k.id])]))).join('')}</div><div class="tw so-pc"><table class="res"><thead><tr><th>Categoria</th>${usC.map(u=>`<th class="num">${esc(u.nome)}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${cats.map(k=>`<tr><td>${esc(k.nome)}</td>${usC.map(u=>`<td class="num">${R.U[u.id].cat[k.id]?fR(R.U[u.id].cat[k.id]):'–'}</td>`).join('')}<td class="num"><b>${fR(sum(usC.map(u=>R.U[u.id].cat[k.id]||0)))}</b></td></tr>`).join('')}</tbody></table></div></div>`;
 $('#uCsv').onclick=()=>csv('desembolso_usuarios',[['Usuário','Despesas do bolso','Aportes','Total colocado','% do total','Receitas recebidas','Retiradas','Saldo','A pagar',...cs.map(x=>x.c.nome)],...us.map(u=>{const x=R.U[u.id];return[u.nome,csvNum(x.des),csvNum(x.ap),csvNum(x.col),csvNum(R.totDes?x.col/R.totDes*100:''),csvNum(x.rec),csvNum(x.ret),csvNum(x.col-x.tirou),csvNum(x.pend),...cs.map(c=>csvNum(x.centro[c.c.id]||0))]}),[],['Fluxo de caixa realizado','Receitas recebidas','Transf. recebidas','Despesas pagas','Transf. enviadas','Saldo'],...[CONTA,...Object.keys(K.M).filter(i=>i!==CONTA)].map(i=>{const a=K.M[i]||{e:0,s:0,ti:0,to:0};return[nomeU(i,'(sem usuário)'),csvNum(a.e),csvNum(a.ti),csvNum(a.s),csvNum(a.to),csvNum(saldoCx(a))]}),['Total',csvNum(K.e),'',csvNum(K.s),'',csvNum(K.e-K.s)]]);
 filtroEv(()=>usuarios(el))}

/* ============ CADASTROS ============ */
function cad(el){el.innerHTML=`<h2>Cadastros</h2><div class="panel"><h3>Centros de custo — culturas / atividades</h3><p class="help">Ex.: Milho, Melancia, Feijão, Ovinos, Silagem. Para separar safras, crie um centro por ciclo (ex.: "Milho" ciclo "2026/27"). A área permite rateio proporcional e indicadores por hectare.</p><div id="cC"></div></div>
 <div class="panel"><h3>Centros de custo específicos — categorias de despesa</h3><p class="help">Ex.: Corretivos, Fertilizantes, Sementes. Grupo <b>COE</b> = desembolso de custeio; grupo <b>COT</b> = custo não desembolsável (depreciação, pró-labore), que entra só no lucro.</p><div id="cK"></div></div>
 <div class="panel"><h3>Usuários / sócios</h3><div id="cU"></div></div>`;
 const at=r=>r.ativo==='0'?'<span class="tag">inativo</span>':'<span class="tag g">ativo</span>',usado=(campo,id)=>vivos('Lancamentos').some(l=>campo==='c'?rateio(l).some(x=>x.c===id):l[campo]===id);
 const del=(tab,campo)=>(a,id)=>{if(a==='ed')formCad(tab,S.T[tab][id]);if(a==='del'){if(usado(campo,id))return alert('Este cadastro é usado em lançamentos. Edite-o e marque como inativo.');if(confirm('Excluir?')){excluir(tab,id);render()}}};
 const ac=()=>'<button data-a="ed">✏️</button><button data-a="del">🗑️</button>';
 const ct=sub=>r=>`<div class="lc-t"><span>${esc(r.nome)}</span><span>${r.ativo==='0'?'<span class="tag">inativo</span>':''}</span></div>${sub(r)?`<div class="lc-s">${sub(r)}</div>`:''}<div class="lc-a"><button class="btn sec sm" data-a="ed">✏️ Editar</button><button class="btn sec sm" data-a="del">🗑️ Excluir</button></div>`;
 lista($('#cC'),'centros',vivos('Centros').sort(byNome),[{h:'Nome',v:c=>c.nome},{h:'Ciclo / safra',v:c=>c.ciclo},{h:'Unidade de venda',v:c=>c.unidade},{h:'Área (ha)',v:c=>c.area,t:'n'},{h:'Situação',v:c=>c.ativo,f:at}],{tb:`<button class="btn" onclick="formCad('Centros')">➕ Novo centro</button>`,cartao:ct(c=>[c.ciclo&&esc(c.ciclo),c.unidade&&esc(c.unidade),c.area&&fN(c.area,1)+' ha'].filter(Boolean).join(' • ')),acoes:ac,acao:del('Centros','c')});
 lista($('#cK'),'cats',vivos('Categorias').sort(byNome),[{h:'Nome',v:k=>k.nome},{h:'Grupo',v:k=>k.grupo,f:k=>k.grupo==='COT'?'<span class="tag y">COT (não desembolsável)</span>':'<span class="tag g">COE</span>'},{h:'Situação',v:k=>k.ativo,f:at}],{tb:`<button class="btn" onclick="formCad('Categorias')">➕ Nova categoria</button>`,cartao:ct(k=>k.grupo==='COT'?'COT — não desembolsável':'COE'),acoes:ac,acao:del('Categorias','categoriaId')});
 lista($('#cU'),'users',vivos('Usuarios').sort(byNome),[{h:'Nome',v:u=>u.nome},{h:'Situação',v:u=>u.ativo,f:at},{h:'Este aparelho',v:u=>u.id===S.cfg.usuarioId?'sim':'',f:u=>u.id===S.cfg.usuarioId?'📱 sim':''}],{tb:`<button class="btn" onclick="formCad('Usuarios')">➕ Novo usuário</button>`,cartao:ct(u=>u.id===S.cfg.usuarioId?'Usa este aparelho':''),acoes:ac,acao:del('Usuarios','usuarioId')})}
function formCad(tab,rec){const novo=!rec,r=rec?{...rec}:{id:uid(),ativo:'1',grupo:'COE'};let h='<form id="fc"><div class="form">';
 h+=fld('Nome *',`<input name="nome" value="${esc(r.nome||'')}">`,tab==='Usuarios'?'w':'');
 if(tab==='Centros')h+=fld('Ciclo / safra',`<input name="ciclo" value="${esc(r.ciclo||'')}" placeholder="Ex.: 2026/27">`)+fld('Unidade de venda',`<input name="unidade" list="dlU2" value="${esc(r.unidade||'')}"><datalist id="dlU2">${UNIDADES.map(u=>`<option value="${u}">`).join('')}</datalist>`)+fld('Área (ha)',`<input name="area" inputmode="decimal" value="${nStr(r.area)}">`)+fld('Observação',`<input name="obs" value="${esc(r.obs||'')}">`,'w');
 if(tab==='Categorias')h+=fld('Grupo',`<select name="grupo">${opt('COE','COE — desembolso de custeio',r.grupo)}${opt('COT','COT — não desembolsável',r.grupo)}</select>`);
 h+=fld('Situação',`<select name="ativo">${opt('1','Ativo',r.ativo)}${opt('0','Inativo (oculto nos lançamentos)',r.ativo)}</select>`);
 h+=`</div><div class="fa"><button type="button" class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn">💾 Salvar</button></div></form>`;
 abrirModal((novo?'Novo: ':'Editar: ')+{Centros:'centro de custo',Categorias:'categoria',Usuarios:'usuário'}[tab],h);
 $('#fc').onsubmit=e=>{e.preventDefault();const f=e.target;['nome','ciclo','unidade','obs','grupo','ativo'].forEach(k=>{if(f.elements[k])r[k]=f.elements[k].value.trim()});if(f.elements.area)r.area=num(f.elements.area.value)??'';
  if(!r.nome)return alert('Informe o nome.');if(tab==='Usuarios'&&r.nome.toLowerCase()===CONTA_NOME.toLowerCase())return alert('A Conta 2D já existe no app; não precisa cadastrar.');if(vivos(tab).some(x=>x.id!==r.id&&x.nome.toLowerCase()===r.nome.toLowerCase()&&(x.ciclo||'')===(r.ciclo||'')))return alert('Já existe um cadastro com esse nome.');
  gravar(tab,r);if(tab==='Usuarios'&&!S.cfg.usuarioId)cfgSet({usuarioId:r.id});fecharModal();render();toast('Salvo')}}

/* ============ CONFIGURAÇÃO ============ */
function config(el){const np=Object.keys(S.pend).length,us=ativos('Usuarios');
 el.innerHTML=`<h2>Configuração</h2><div class="grid2"><div class="panel"><h3>🔗 Conexão com a planilha do Google</h3>
 <div class="form" style="grid-template-columns:1fr">${fld('Endereço do app da Web (termina em /exec)',`<input id="cUrl" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/.../exec">`)}${fld('Chave de acesso (a mesma do Code.gs)',`<input id="cKey" type="password" value="${esc(S.cfg.chave)}">`)}</div>
 <div class="toolbar" style="margin-top:10px"><button class="btn" id="cSave">Testar e conectar</button>${S.cfg.url?'<button class="btn sec" id="cOff">Desconectar</button>':''}</div>
 <table><tbody><tr><td>Situação</td><td>${S.cfg.url?(erroSync?'<span class="neg">⚠ '+esc(erroSync)+'</span>':'<span class="pos">conectado</span>'):'só neste aparelho'}</td></tr><tr><td>Última sincronização</td><td>${S.cfg.ultimaSync?new Date(S.cfg.ultimaSync).toLocaleString('pt-BR'):'–'}</td></tr><tr><td>Alterações aguardando envio</td><td>${np}</td></tr><tr><td>Internet</td><td>${navigator.onLine?'disponível':'sem conexão'}</td></tr></tbody></table>
 <div class="toolbar" style="margin-top:10px"><button class="btn sec" onclick="sincronizar(true)">🔄 Sincronizar agora</button><button class="btn sec" id="cFull">⬇ Baixar tudo da planilha de novo</button></div></div>
 <div class="panel"><h3>👤 Quem usa este aparelho</h3><p class="help">Usado como padrão no campo "Pago por" e para registrar o autor dos lançamentos.</p>
 <div class="toolbar"><select id="cUser"><option value="">— selecione —</option>${us.map(u=>opt(u.id,u.nome,S.cfg.usuarioId)).join('')}</select><button class="btn sec" onclick="formCad('Usuarios')">➕ Cadastrar novo usuário</button></div>
 <h3 style="margin-top:16px">💾 Cópia de segurança</h3><p class="help">A planilha do Google já é a cópia central. Mesmo assim, você pode baixar um arquivo com tudo deste aparelho.</p>
 <div class="toolbar"><button class="btn sec" id="cBk">⬇ Baixar backup (JSON)</button><button class="btn sec" id="cCsv">⬇ Todos os lançamentos (CSV)</button></div></div></div>`;
 $('#cSave').onclick=async()=>{const url=$('#cUrl').value.trim(),ch=$('#cKey').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))return alert('Endereço inválido. Ele deve começar com https://script.google.com/');if(!ch)return alert('Informe a chave.');
  const b=$('#cSave');b.disabled=true;b.textContent='Testando…';try{const j=await chamar({acao:'ping'},url,ch);if(S.cfg.url!==url)zerarCursor();cfgSet({url,chave:ch,configurado:true});erroSync='';toast('Conectado à planilha "'+j.planilha+'"');await sincronizar();render()}catch(e){alert('Não foi possível conectar:\n'+e.message)}finally{b.disabled=false;b.textContent='Testar e conectar'}};
 if($('#cOff'))$('#cOff').onclick=()=>{if(confirm('Desconectar este aparelho da planilha? Os dados locais continuam aqui.')){cfgSet({url:''});render()}};
 $('#cFull').onclick=async()=>{if(!S.cfg.url)return alert('Conecte primeiro.');zerarCursor();await sincronizar(true);render()};
 $('#cUser').onchange=e=>{cfgSet({usuarioId:e.target.value,configurado:true});render()};
 $('#cBk').onclick=()=>baixar(new Blob([JSON.stringify({T:S.T,exportadoEm:new Date().toISOString()},null,1)],{type:'application/json'}),'agropecuaria2d_backup_'+hoje()+'.json');
 $('#cCsv').onclick=()=>csv('lancamentos',[['Data','Tipo','Categoria','Descrição','Rateio','Quantidade','Unidade','Preço unit.','Valor','Situação','Vencimento','Usuário','Fornecedor/cliente','Forma pgto','Doc','Obs'],...vivos('Lancamentos').sort((a,b)=>a.data<b.data?-1:1).map(l=>[fD(l.data),l.tipo,l.categoria,l.descricao,l.rateioTexto,csvNum(l.quantidade),l.unidade,csvNum(l.precoUnit),csvNum(l.valor),l.status,fD(l.vencimento),l.usuario,l.pessoa,l.formaPgto,l.doc,l.obs])])}

/* ============ INÍCIO ============ */
const V={painel,lanc,rel,usuarios,cad,config};
(async()=>{await carregar();if(!V[ABA]||cel())ABA='painel';render();statusSync();agendarSync(500);
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
